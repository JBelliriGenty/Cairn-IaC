<style>
/* Cairn design system (github.com/JBelliriGenty/Cairn-NAS, DESIGN.md): tokens and components copied as is,
   then this page's own parts. One hue per measure: Tofu = teal (--c-pool), Ansible = pink (--c-temp);
   green/amber/red are kept for states. */
:root {
  --bg: #eef1f8; --panel: #ffffff; --fg: #131416; --muted: #5d5f60; --line: #e5e8ef; --control: #8b909a;
  --track: #eceff5; --primary: #1d1f20; --on-primary: #ffffff; --accent: #4f46e5;
  --c-pool: #0d9488; --c-temp: #db2777; --pool-ink: #0f766e; --temp-ink: #be185d;
  --ok: #1e7b4f; --ok-bg: #dcfae5; --ok-ink: #04250e; --bad: #b42318; --warn: #b54708; --warn-bg: #fef0c7;
  --radius: 8px; --radius-sheet: 16px;
  --duration-stagger: 40ms; --duration-slow: 400ms; --distance-base: 8px; --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
  --tofu: var(--c-pool); --tofu-ink: var(--pool-ink); --ans: var(--c-temp); --ans-ink: var(--temp-ink);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0c0d12; --panel: #15161c; --fg: #f2f2f3; --muted: #a4a7ab; --line: #2a2c35; --control: #6b7080;
  --track: #23252e; --primary: #f2f2f3; --on-primary: #111213; --accent: #818cf8;
  --c-pool: #2dd4bf; --c-temp: #f472b6; --pool-ink: #2dd4bf; --temp-ink: #f472b6;
  --ok: #3fc07a; --ok-bg: #172a1d; --ok-ink: #3fc07a; --bad: #f97066; --warn: #fdb022; --warn-bg: #2b2111;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0d12; --panel: #15161c; --fg: #f2f2f3; --muted: #a4a7ab; --line: #2a2c35; --control: #6b7080;
    --track: #23252e; --primary: #f2f2f3; --on-primary: #111213; --accent: #818cf8;
    --c-pool: #2dd4bf; --c-temp: #f472b6; --pool-ink: #2dd4bf; --temp-ink: #f472b6;
    --ok: #3fc07a; --ok-bg: #172a1d; --ok-ink: #3fc07a; --bad: #f97066; --warn: #fdb022; --warn-bg: #2b2111;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }

/* layout */
.app { display: grid; grid-template-columns: 228px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 18px 12px; background: var(--bg); }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; }
.brand b { display: block; font-size: 16px; }
.brand small { color: var(--muted); font-size: 12px; }
.logo { width: 30px; height: 30px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav button { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 0; border-radius: 8px; background: none;
  cursor: pointer; text-align: left; color: var(--muted); transition: background .15s, color .15s; }
#nav button:hover { background: var(--track); color: var(--fg); }
#nav button[aria-current="page"] { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: var(--accent); font-weight: 600; }
#nav svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
.legend { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.legend-item { display: flex; align-items: center; gap: 8px; }
main { padding: 24px 24px 40px; min-width: 0; background: var(--panel); margin: 8px 8px 8px 0;
  border: 1px solid var(--line); border-radius: var(--radius-sheet); min-height: calc(100vh - 16px); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { margin: 0; font-size: 22px; font-weight: 600; }
h2 { font-size: 16px; font-weight: 600; margin: 24px 0 10px; }
h3 { margin: 0; font-size: 16px; font-weight: 600; }
.meta, .sub { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
.verdict { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; padding: 12px 16px; border-radius: var(--radius); font-size: 18px; font-weight: 600;
  background: var(--track); border: 1px solid var(--line); }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); align-content: start; }
  .side { display: contents; }
  .brand { padding: 12px 16px 4px; }
  #nav { position: sticky; top: 0; z-index: 5; flex-direction: row; overflow-x: auto; scrollbar-width: none; padding: 6px 12px;
    background: var(--bg); border-bottom: 1px solid var(--line); }
  #nav button { white-space: nowrap; }
  .side-foot { order: 1; flex-direction: row; flex-wrap: wrap; align-items: center; margin: 0; padding: 16px; }
  .legend { flex-direction: row; flex-wrap: wrap; gap: 10px; }
  main { padding: 16px; margin: 0; border: 0; border-radius: 0; min-height: 0; }
}
@keyframes rise { from { opacity: 0; transform: translateY(var(--distance-base)) scale(.985); } to { opacity: 1; transform: none; } }
.view.enter .card { animation: rise var(--duration-slow) var(--ease-smooth-out) both; }
.view.enter .card:nth-child(2) { animation-delay: var(--duration-stagger); }
.view.enter .card:nth-child(n+3) { animation-delay: calc(2 * var(--duration-stagger)); }
@media (prefers-reduced-motion: reduce) { .view.enter .card { animation: none; } * { transition: none !important; } }

/* cards, stats, pills, chips, tables, buttons */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.grid { display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.label { color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; padding: 8px 10px; border-radius: 8px; background: var(--track); min-width: 0; }
.stat span { color: var(--muted); font-size: 12px; }
.stat b { font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; background: var(--track); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--track); cursor: pointer; font-size: 14px; }
a.chip { text-decoration: none; color: inherit; }
.chip:hover { border-color: var(--control); }
details { margin-top: 0; }
summary { cursor: pointer; color: var(--accent); user-select: none; }
.table-wrap { padding: 0; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
tr:last-child td { border-bottom: 0; }
td.wrap { white-space: normal; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 820px) {
  .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; }
  .table-wrap thead { display: none; }
  .table-wrap tr { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .table-wrap tr:last-child { border-bottom: 0; }
  .table-wrap td { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; border: 0; white-space: normal; text-align: right; }
  .table-wrap td:first-child { text-align: left; }
  .table-wrap td[data-label]:not(:first-child)::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-align: left; }
}
button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--control); background: var(--panel); cursor: pointer; }
button:hover { border-color: var(--muted); }
button.ghost { background: none; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { padding: 6px 10px; border: 1px solid var(--control); border-radius: 6px; background: var(--panel); max-width: 100%; }
.toolbar { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.mono, code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.sw.t { background: var(--tofu); } .sw.a { background: var(--ans); }

/* ---------- cairn-iac ---------- */
.lead { color: var(--muted); max-width: 70ch; margin: 0 0 16px; }
.flows { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.flow { display: flex; flex-direction: column; gap: 12px; min-width: 0; border-top: 3px solid var(--line); }
.flow.t { border-top-color: var(--tofu); } .flow.a { border-top-color: var(--ans); }
.flow .who { font-size: 12px; }
.flow.t .who { color: var(--tofu-ink); } .flow.a .who { color: var(--ans-ink); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 12px; }
.steps li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; margin: 5px 0 0 5px; background: var(--panel); border: 2px solid var(--c); }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 10px; top: 17px; bottom: 0; width: 1px; background: var(--line); }
.flow.t .steps { --c: var(--tofu); } .flow.a .steps { --c: var(--ans); }
.cmd { display: block; overflow-x: auto; white-space: nowrap; background: var(--track); border-radius: 6px; padding: 5px 10px; margin-top: 4px; }

.park { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .park { grid-template-columns: 1fr; } }
.nodes { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); align-items: start; }
.node { display: flex; flex-direction: column; gap: 6px; padding: 12px; background: var(--track); border: 0; }
.node-h { display: flex; justify-content: space-between; gap: 8px; padding: 0 2px 2px; }
.node-h b { font-size: 14px; }
.m { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; text-align: left; border-color: var(--line); padding: 7px 10px; transition: border-color .15s, background .15s, opacity .15s; }
.m.phys { border-left: 3px solid var(--muted); }
.m b { font-weight: 600; }
.m .label { grid-column: 1; font-variant-numeric: tabular-nums; }
.m .marks { grid-column: 2; grid-row: 1 / 3; display: flex; gap: 3px; align-self: center; }
.m[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.nodes.filtering .m:not(.match) { opacity: .35; }
.nodes.filtering .m.match { border-color: var(--accent); }
@media (max-width: 820px) { .nodes.filtering .m:not(.match) { display: none; } }
.search { flex: 1 1 260px; }
.search input { flex: 1; width: auto; }
.cap { display: flex; flex-direction: column; gap: 4px; padding: 0 2px 4px; }
.cap .row { justify-content: space-between; gap: 2px 8px; }
.cap .label { font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--panel); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--tofu); border-radius: inherit; }
.bar.thin { height: 4px; }
.meter.warn .bar i { background: var(--warn); }
.meter.bad .bar i { background: var(--bad); }
.meter.bad .label b { color: var(--bad); }
.meter.warn .label b { color: var(--warn); }

.detail { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 18px; min-width: 0; max-height: calc(100vh - 48px); overflow: auto; }
@media (max-width: 1100px) { .detail { position: static; max-height: none; } }
.layer { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.layer > .row h3 { margin-right: auto; }
.pill.t { background: color-mix(in srgb, var(--tofu) 14%, var(--panel)); color: var(--tofu-ink); }
.pill.a { background: color-mix(in srgb, var(--ans) 14%, var(--panel)); color: var(--ans-ink); }
pre.code { margin: 8px 0 0; padding: 10px 12px; overflow-x: auto; border-radius: 6px; background: var(--track); font: 12px/1.5 ui-monospace, Consolas, monospace; }
.c-com { color: var(--muted); } .c-str { color: var(--tofu-ink); } .c-key { color: var(--accent); }
.detail .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); }
.detail table, .detail tbody, .detail tr, .detail td { display: block; }
.detail thead { display: none; }
.detail tr { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.detail tr:last-child { border-bottom: 0; }
.detail td { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; border: 0; white-space: normal; text-align: right; }
.detail td:first-child { font-weight: 600; text-align: left; }
.detail td[data-label]:not(:first-child)::before { content: attr(data-label); color: var(--muted); font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; text-align: left; flex: none; }
.roles { display: flex; flex-direction: column; gap: 6px; }
.role { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; }
.role summary { display: flex; justify-content: space-between; gap: 8px; color: var(--fg); }
.role summary code { font-size: 13px; color: var(--ans-ink); }
.role[open] summary { margin-bottom: 8px; }
.role ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 2px; }
.role .chips, .layer > .chips { margin-top: 8px; }
.layer .sub a { color: var(--accent); }
.role .sub { white-space: pre-line; margin: 0 0 8px; }
.empty { color: var(--muted); margin: 0; }

/* editing (server mode) */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; align-items: end; margin-top: 10px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.form .wide { grid-column: 1 / -1; }
input, textarea { padding: 6px 10px; border: 1px solid var(--control); border-radius: 6px; background: var(--panel); min-width: 0; width: 100%; }
input[type=checkbox] { width: auto; }
label.check { flex-direction: row; align-items: center; color: var(--fg); font-size: 14px; }
textarea { min-height: 70px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
button.small { padding: 2px 8px; font-size: 12px; }
.edit summary { font-size: 14px; }
.pill.x { border: 0; cursor: pointer; font: inherit; font-size: 12px; }
.pill.x:hover { background: color-mix(in srgb, var(--bad) 14%, var(--panel)); }
.err { color: var(--bad); margin: 0; }
.okmsg { color: var(--ok); margin: 0; }
dialog { border: 1px solid var(--line); border-radius: var(--radius-sheet); background: var(--panel); color: var(--fg); padding: 20px;
  width: min(820px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.review { display: flex; flex-direction: column; gap: 12px; }
.review label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.review .row { justify-content: flex-end; }
pre.diff { max-height: 50vh; }
.diff .add { color: var(--ok); } .diff .del { color: var(--bad); } .diff .hunk { color: var(--accent); }
.settings { display: flex; flex-direction: column; gap: 14px; max-width: 980px; }
.settings h3 { margin-bottom: 2px; }
.key { display: block; overflow-wrap: anywhere; background: var(--track); border-radius: 6px; padding: 8px 10px; }

/* drift */
.pill.warn, .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 99px; background: var(--track); color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.verdict a { color: inherit; text-decoration-color: var(--control); text-underline-offset: 3px; }
.verdict a.warn { color: var(--warn); }
.drift { grid-template-columns: minmax(0, 1fr); max-width: 980px; }
.findings { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.findings li { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.findings .chips .label { align-self: center; }
.mfind { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.mfind li { padding: 2px 0 2px 10px; border-left: 3px solid var(--line); color: var(--muted); }
.mfind li.warn { border-left-color: var(--warn); color: var(--fg); }

/* history */
.hist summary { font-size: 16px; font-weight: 600; color: var(--fg); }
.hlist { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.hlist li { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); }
.hlist li:first-child { border-top: 0; }
.hlist a.mono { color: var(--accent); }
.hist .sub { margin-top: 8px; }

/* flows */
.fl { grid-template-columns: minmax(0, 1fr); }
.fl .card > .row { margin-bottom: 8px; }
.fl td .chips { flex-wrap: nowrap; }
.fl td.wrap { min-width: 220px; }
.fl td.wrap .pill { margin-left: 6px; }
.fl a.mono { color: var(--muted); }
@media (max-width: 820px) { .fl td .chips { flex-wrap: wrap; justify-content: flex-end; } }

const DICT = {fr: FR};
const LANGS = {en: {name: "English", locale: "en-GB"}, fr: {name: "Français", locale: "fr-FR"}};
let lang = "en";
try { lang = localStorage.getItem("cairn-iac-lang") || ""; } catch {}
if (!LANGS[lang]) lang = LANGS[D.lang] ? D.lang : Object.keys(LANGS).find(l => (navigator.language || "").startsWith(l)) || "en";
document.documentElement.lang = lang;
const T = DICT[lang] || {};
const t = (s, v = {}) => (T[s] || s).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
// English and French plurals differ at 0 (en: 0 tasks, fr: 0 tâche).
// Plural by the language's own rule (en: 0 tasks, fr: 0 tâche). A plural that English spells
// like its singular is keyed "<string>#pl" in the other languages' tables.
const plural = new Intl.PluralRules(lang);
const tp = (n, one, many, v = {}) => {
  const pl = plural.select(n) !== "one", k = pl ? many : one;
  return t(pl && T[k + "#pl"] ? k + "#pl" : k, {n, ...v});
};
const locale = LANGS[lang].locale;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const code = s => `<code>${esc(s)}</code>`;
const key = s => String(s).toLowerCase().replace(/_/g, "-");

// ---------- model: one entry per machine, merged from Tofu, firewalls and the inventory ----------
// (the export's machines, plus the full Tofu block and firewall for the detail)
const M = {}, tofuAt = Object.fromEntries(D.tofu.map(x => [x.address, x]));
const nodeKeys = D.nodes.map(key), bareKeys = D.bare.map(key);
for (const x of D.machines) M[x.key] = {...x, name: x.name.toUpperCase(), tofu: x.tofu && tofuAt[x.tofu.address], fw: x.firewall != null ? D.firewalls[x.firewall] : null, pbs: x.playbooks};
const roleUse = {};
for (const m of Object.values(M)) for (const r of m.roles) (roleUse[r] ||= []).push(m.key);
const FL = D.flows || [];
const mname = k => M[k] ? M[k].name : String(k).toUpperCase();
const names = v => ({...v, ...(v.src && {src: mname(v.src)}), ...(v.dst && {dst: mname(v.dst)}), ...(v.what && {what: t(v.what)})});
const touches = (f, k) => [f.src, f.dst].some(e => e.k === k || e.n.includes(k));

// ---------- frame ----------
$("#title").textContent = D.title;
$("#subtitle").textContent = D.subtitle;
document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.textContent));
$("#meta").textContent = t("Read from the repository{rev}", {rev: D.rev ? ` · ${D.rev}` : ""}) + (S ? ` · ${S.user}` : "");
const nAns = Object.values(M).filter(m => m.roles.length).length, nFw = Object.keys(D.firewalls).length;
const F = D.findings || [], nWarn = F.filter(f => f.severity === "warn").length;
$("#verdict").innerHTML = esc([tp(D.tofu.length, "{n} machine described by Tofu", "{n} machines described by Tofu"),
  tp(nAns, "{n} configured by Ansible", "{n} configured by Ansible"), tp(nFw, "{n} guest firewall", "{n} guest firewalls")].join(", "))
  + (F.length ? ` · <a href="#drift"${nWarn ? ' class="warn"' : ""}>${esc(tp(F.length, "{n} drift finding", "{n} drift findings"))}</a>` : "");
if (F.length) document.querySelector('#nav [data-view="drift"]').insertAdjacentHTML("beforeend", `<span class="badge${nWarn ? " warn" : ""}">${F.length}</span>`);
if (D.error) $("#verdict").textContent = t("Cannot read the repository: {err}", {err: D.error}) + (EDIT ? " " + t("Check the Settings.") : "");
if (D.note && D.note.text) $("#note").innerHTML = `<h2>${esc(D.note.title || "")}</h2><article class="card"><p class="empty">${esc(D.note.text).replace(/`([^`]+)`/g, "<code>$1</code>")}</p></article>`;

// ---------- machines map ----------
const tile = m => `<button class="m${m.phys ? " phys" : ""}" data-k="${m.key}" aria-pressed="false"><b>${esc(m.name)}</b><span class="label">${esc(m.ip || (m.id != null ? "id " + m.id : ""))}</span><span class="marks">${m.tofu || m.fw ? '<i class="sw t" title="Tofu"></i>' : ""}${m.roles.length ? '<i class="sw a" title="Ansible"></i>' : ""}</span></button>`;
const mem = mb => !mb ? "—" : mb >= 1024 ? `${(mb / 1024).toLocaleString(locale)} ${t("GiB")}` : `${mb} ${t("MiB")}`;
const disk = gb => gb ? `${gb} ${t("GB")}` : "—";
// capacity of a node: sums of what Tofu gives its guests, against the declared total (Settings) when there is one
// disk in TB (of 1024 GB, as Proxmox counts) once the node's figures reach 1 TB, both sides of a row in the same unit
const tb = (gb, big) => big >= 1024 ? `${(gb / 1024).toLocaleString(locale, {maximumFractionDigits: 2})} ${t("TB")}` : disk(gb);
const CAPF = [["cores", "vCPU", n => n], ["memory", "Memory", mem], ["disk", "Disk", tb]];
const capBlock = n => {
  const c = (D.capacity || {})[n];
  return !c ? "" : `<div class="cap">${CAPF.map(([f, label, fmt]) => {
    const used = c[f], tot = c.total[f], unk = c.unknown[f], pct = tot ? used / tot * 100 : 0;
    return `<div class="meter${pct > 100 ? " bad" : pct > 80 ? " warn" : ""}"><div class="row"><span class="label">${t(label)}</span><span class="label"><b>${used ? esc(fmt(used, Math.max(used, tot || 0))) : 0}</b>${tot ? " / " + esc(fmt(tot, Math.max(used, tot))) : ""}${unk.length ? ` <span title="${esc(t("Not a literal number in Tofu (a variable?): {list}", {list: unk.join(", ")}))}">+ ${esc(tp(unk.length, "{n} unknown", "{n} unknown"))}</span>` : ""}</span></div>${tot ? `<div class="bar thin"><i style="width:${Math.min(pct, 100).toFixed(1)}%"></i></div>` : ""}</div>`;
  }).join("")}</div>`;
};
const colNodes = [...new Set([...nodeKeys, ...Object.values(M).map(m => m.node).filter(Boolean)])];
const placed = new Set();
let cols = colNodes.map(n => {
  const guests = Object.values(M).filter(m => m.node === n && !m.phys).sort((a, b) => (a.id ?? 0) - (b.id ?? 0));
  const list = [M[n], ...guests].filter(Boolean);
  list.forEach(m => placed.add(m.key));
  return `<div class="card node"><div class="node-h"><b>${esc(n.toUpperCase())}</b><span class="label">${tp(guests.length, "{n} guest", "{n} guests")}</span></div>${capBlock(n)}${list.map(tile).join("")}</div>`;
});
const bare = bareKeys.map(k => M[k]).filter(m => m && !placed.has(m.key));
bare.forEach(m => placed.add(m.key));
if (bare.length) cols.push(`<div class="card node"><div class="node-h"><b>${t("Outside the cluster")}</b><span class="label">${t("physical")}</span></div>${bare.map(tile).join("")}</div>`);
const rest = Object.values(M).filter(m => !placed.has(m.key)).sort((a, b) => a.key.localeCompare(b.key));
if (rest.length) cols.push(`<div class="card node"><div class="node-h"><b>${t("Other")}</b><span class="label">${rest.length}</span></div>${rest.map(tile).join("")}</div>`);
$("#nodes").innerHTML = cols.join("");

$("#rolefilter").innerHTML += Object.keys(D.roles).sort().map(r => `<option value="${esc(r)}">${esc(r)} (${(roleUse[r] || []).length})</option>`).join("");
// search: every word in the machine's name, IP, id, node, roles or groups; with the role highlight, both must match
const hay = m => [m.key, m.ip, m.id, m.node, m.host, ...m.roles, ...m.groups].filter(x => x != null).join(" ").toLowerCase();
function filterMap() {
  const words = $("#search").value.toLowerCase().split(/\s+/).filter(Boolean), r = $("#rolefilter").value;
  $("#nodes").classList.toggle("filtering", !!(words.length || r));
  document.querySelectorAll(".m").forEach(b => { const m = M[b.dataset.k], h = hay(m);
    b.classList.toggle("match", (!r || m.roles.includes(r)) && words.every(w => h.includes(w))); });
}
$("#search").placeholder = t("Name, IP, id, role, group, node");
$("#rolefilter").addEventListener("change", filterMap);
$("#search").addEventListener("input", filterMap);
filterMap();  // a value the browser restored
addEventListener("keydown", e => {
  if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable]") || $("#review").open) return;
  e.preventDefault();
  if ($('.view[data-view="machines"]').hidden) { location.hash = "machines"; show("machines"); }
  $("#search").focus();
});

// ---------- export: the same JSON as cairn-iac.py --json, from the data already in the page ----------
const EXPORT = ["title", "rev", "machines", "capacity", "firewalls", "roles", "playbooks", "groups", "findings", "flows"];
$("#dl").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(Object.fromEntries(EXPORT.map(k => [k, D[k]])), null, 2) + "\n"], {type: "application/json"}));
  a.download = "cairn-iac.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

function hcl(src) {
  return src.split("\n").map(l => {
    const i = l.indexOf("#");
    const [c, com] = i >= 0 && !/"[^"]*#/.test(l.slice(0, i + 1)) ? [l.slice(0, i), l.slice(i)] : [l, ""];
    return esc(c).replace(/^(\s*)([a-z_]+)(\s*=)/, '$1<span class="c-key">$2</span>$3').replace(/&quot;[^&]*?&quot;/g, s => `<span class="c-str">${s}</span>`) + (com ? `<span class="c-com">${esc(com)}</span>` : "");
  }).join("\n");
}
const pickPb = m => m.pbs.find(p => key(p) === m.key) || m.pbs.find(p => !D.generic_playbooks.includes(p)) || m.pbs[0];
// Links to the Git web UI: links.view / links.edit are URL templates with {file} and {line}.
const L = D.links || {}, P = D.paths;
const url = (tpl, file, line) => tpl.replace("{file}", file.split("/").map(encodeURIComponent).join("/")).replace("{line}", line || 1);
const links = (file, line) => [L.view && `<a class="chip" href="${esc(url(L.view, file, line))}" target="_blank" rel="noopener">${esc(t("View in {name}", {name: L.name || "Git"}))}</a>`,
  L.edit && `<a class="chip" href="${esc(url(L.edit, file, line))}" target="_blank" rel="noopener">${esc(t("Edit in {name}", {name: L.name || "Git"}))}</a>`].filter(Boolean).join("");
const linkRow = (file, line) => (L.view || L.edit) ? `<div class="chips">${links(file, line)}</div>` : "";
const step = (html, cmd) => `<li><div>${html}${cmd ? `<code class="cmd">${esc(cmd)}</code>` : ""}</div></li>`;

function renderFlow(m) {
  const w = D.workflow || {}, tofu = w.tofu || "tofu", tf = m.tofu;
  $("#lead").innerHTML = esc(t("OpenTofu builds the box: processor, memory, disk, IP address, firewall. Ansible fills it: packages, containers, configuration. The path below follows {name}; it changes with the machine picked in Machines.", {name: "\u0000"})).replace("\u0000", `<b>${esc(m.name)}</b>`);
  let s = "";
  if (tf) {
    s += step(t("On {ws}, edit the {addr} block in {file}, line {line}.", {ws: esc(w.workstation || t("your workstation")), addr: code(tf.address), file: code(tf.file), line: tf.line}));
    s += step(esc(t("Compute the difference with reality, for this machine only:")), `${tofu} plan -target=${tf.address} -out=${m.key}.plan`);
    s += step(esc(w.reviewer ? t("{who} reviews the plan and applies it:", {who: w.reviewer}) : t("Review the plan, then apply it:")), `${tofu} apply ${m.key}.plan`);
    s += step(esc(t("OpenTofu calls the Proxmox API on {node}: {kind} {id}, {cores} vCPU, {mem}, {disk}, IP {ip}.", {node: (m.node || "?").toUpperCase(), kind: tf.kind, id: tf.id ?? "", cores: tf.cores ?? "?", mem: mem(+tf.memory), disk: disk(tf.disk), ip: m.ip || "—"})));
    if (m.fw) s += step(tp(m.fw.rules.length, "The guest firewall ({file}) only opens the {n} declared flow.", "The guest firewall ({file}) only opens the {n} declared flows.", {file: code(m.fw.file)}));
  } else {
    s += step(esc(m.phys ? t("{name} is not created by Tofu: it is a physical machine, installed by hand.", {name: m.name}) : t("{name} is not created by Tofu: it predates the repository.", {name: m.name})));
    if (m.fw) s += step(t("Tofu still manages its firewall: {n} flows in {file}.", {n: m.fw.rules.length, file: code(m.fw.file)}));
  }
  $("#flow-tofu").innerHTML = s;
  const pb = pickPb(m);
  if (!pb) { $("#flow-ans").innerHTML = step(esc(t("No playbook targets {name}: Ansible does not configure it.", {name: m.name}))); return; }
  const file = D.playbook_prefix + pb + ".yml";
  s = step(t("Edit a role or {file}, then:", {file: code(file)}), "git commit && git push");
  if (w.git_server) s += step(esc(t("The commit reaches {git}.", {git: w.git_server})));
  s += w.controller ? step(esc(t("{ctl}, the Ansible controller, pulls the latest version:", {ctl: w.controller})), `${w.controller_path ? `cd ${w.controller_path} && ` : ""}git pull`)
                    : step(esc(t("On the Ansible controller, pull the latest version:")), `${w.controller_path ? `cd ${w.controller_path} && ` : ""}git pull`);
  s += step(esc(t("Run the playbook, as a dry run first:")), `${w.ansible || "ansible-playbook"} ${file} -l ${m.host || m.key} --check --diff`);
  s += step(esc(t("Ansible connects over SSH to {host} and applies {roles}, task by task; a task already in the right state changes nothing.", {host: m.ip || m.host || m.key, roles: tp(m.roles.length, "{n} role", "{n} roles")})));
  $("#flow-ans").innerHTML = s;
}

function renderDetail(m) {
  const tf = m.tofu;
  let h = `<div><h3>${esc(m.name)}</h3><p class="meta">${esc(m.phys ? t("Physical machine") : tf ? tf.kind : t("Guest"))}${m.node && !m.phys ? esc(t(" on {node}", {node: m.node.toUpperCase()})) : ""} · <span class="mono">${esc(m.ip || t("no IP declared"))}</span>${m.id != null ? " · id " + m.id : ""}</p></div>`;
  const mf = F.filter(f => f.machine === m.key);
  if (mf.length) h += `<ul class="mfind">${mf.map(f => `<li class="${f.severity}">${esc(t(f.msg, names(f.vars)))}</li>`).join("")}</ul>`;
  h += `<section class="layer"><div class="row"><h3>${t("The box")}</h3><span class="pill t">tofu</span></div>`;
  h += tf ? `<div class="stats">
      <div class="stat"><span>vCPU</span><b>${esc(tf.cores ?? "—")}</b></div>
      <div class="stat"><span>${t("Memory")}</span><b>${mem(+tf.memory)}</b></div>
      <div class="stat"><span>${t("Disk")}</span><b>${disk(tf.disk)}</b></div>
      <div class="stat"><span>${t("Tofu address")}</span><b class="mono">${esc(tf.address)}</b></div></div>
      <details><summary>${esc(t("Show the code ({file}, line {line})", {file: tf.file, line: tf.line}))}</summary><pre class="code">${hcl(tf.code)}</pre></details>${linkRow(tf.file, tf.line)}
      ${EDIT ? `<details class="edit"><summary>${t("Change the resources")}</summary><form class="form" data-op="resources">
        <label>vCPU<input name="cores" type="number" min="1" max="512" value="${esc(tf.cores)}"></label>
        <label>${t("Memory")} (${t("MiB")})<input name="memory" type="number" min="16" value="${esc(tf.memory)}"></label>
        <label>${t("Disk")} (${t("GB")})<input name="disk" type="number" min="${esc(tf.disk || 1)}" value="${esc(tf.disk)}"></label>
        <button class="primary">${t("Preview")}</button></form></details>` : ""}`
    : `<p class="empty">${t(m.phys ? "Physical machine: no Tofu file creates it." : "Not described by Tofu.")}</p>`;
  h += `</section><section class="layer"><div class="row"><h3>${t("Firewall")}</h3><span class="pill t">tofu</span></div>`;

// ---------- history (server mode): the latest commits touching a machine, from GET /api/history ----------
let histOpen = false;
const day = d => new Date(d + "T12:00:00").toLocaleDateString(locale);
const WHAT = {tofu: ["Tofu", "t"], firewall: ["Firewall", "t"], inventory: ["Inventory", "a"], playbook: ["Playbook", "a"]};
async function loadHistory(k) {
  const body = $("#hist-body");
  body.innerHTML = `<p class="empty">${t("Loading…")}</p>`;
  let r;
  try {
    const res = await fetch("/api/history?machine=" + encodeURIComponent(k));
    r = await res.json();
    if (!res.ok || r.error) throw r;
  } catch (e) { if (current === k) body.innerHTML = `<p class="err">${esc(errText(e.error ? e : {error: "Invalid request"}))}</p>`; return; }
  if (current !== k || !$("#hist-body")) return;  // another machine was picked meanwhile
  const sha = c => L.commit ? `<a class="mono" href="${esc(L.commit.replace("{sha}", c.sha))}" target="_blank" rel="noopener">${esc(c.short)}</a>` : `<span class="mono label">${esc(c.short)}</span>`;
  $("#hist-body").innerHTML = (r.commits.length ? `<ul class="hlist">${r.commits.map(c => `<li>
      <span class="wrap">${esc(c.subject)}</span>

// ---------- editing (server mode): a form gives an edit, the server shows its diff, then commits and pushes ----------
async function api(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: "Invalid request"}));
  if (!r.ok || j.error) throw j.error ? j : {error: "Invalid request"};
  return j;
}
const errText = e => e && e.error ? t(e.error, {...e.vars, what: t(e.vars?.what ?? "")}) : String(e);
let pending = null;
async function preview(op, where) {
  op = {...op, rev: S.rev};
  try {
    const p = await api("/api/preview", op);
    pending = op;
    $("#rv-file").textContent = p.file;
    $("#rv-diff").innerHTML = p.diff.split("\n").map(l => `<span class="${l.startsWith("@@") ? "hunk" : l.startsWith("+") && !l.startsWith("+++") ? "add" : l.startsWith("-") && !l.startsWith("---") ? "del" : ""}">${esc(l)}</span>`).join("\n");
    $("#rv-msg").value = p.message;
    $("#rv-err").textContent = "";
    $("#rv-go").disabled = false; $("#rv-err").className = "err"; $("#rv-cancel").textContent = t("Cancel");
    $("#review").showModal();
  } catch (e) {
    where.querySelector(".err")?.remove();
    where.insertAdjacentHTML("beforeend", `<p class="err wide" role="alert">${esc(errText(e))}</p>`);
  }
}
$("#rv-cancel").addEventListener("click", () => $("#review").close());
$("#rv-go").addEventListener("click", async () => {
  $("#rv-go").disabled = true; $("#rv-err").textContent = "";
  try {
    const c = await api("/api/commit", {...pending, message: $("#rv-msg").value});
    $("#rv-err").className = "okmsg";
    if (c.pushed && c.mode !== "push") {
      // the edit waits in a pull request: the page stays on the branch as it is, no reload
      $("#rv-err").innerHTML = esc(t(c.mode === "agit" ? "Commit {sha} sent as a pull request ({ref}). Once merged: plan and apply, or run the playbook, as the path shows." : "Commit {sha} pushed on the branch {ref}: open its pull request. Once merged: plan and apply, or run the playbook, as the path shows.", {sha: c.commit, ref: c.ref}))
        + (c.link ? ` <a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(t("Open the pull request"))}</a>` : "");
      $("#rv-cancel").textContent = t("Close");
      return;
    }
    $("#rv-err").textContent = t(c.pushed ? "Commit {sha} pushed. Next: plan and apply, or run the playbook, as the path shows." : "Commit {sha} made (not pushed). Next: plan and apply, or run the playbook, as the path shows.", {sha: c.commit});
    setTimeout(() => location.reload(), 2500);
  } catch (e) { $("#rv-err").className = "err"; $("#rv-err").textContent = errText(e); $("#rv-go").disabled = false; }
});
$("#detail").addEventListener("submit", e => {

  `<tr><td>${ep(f.src)}</td><td data-label="${t("To")}">${ep(f.dst)}</td><td class="mono" data-label="${t("Port")}">${esc(flowWhat(f))}</td>
   <td class="wrap" data-label="${t("Why")}">${esc(f.comment || "")}${f.common ? `<span class="pill t">${t("module")}</span>` : ""}${f.half ? `<span class="pill">${t("half-open")}</span>` : ""}</td>
   <td data-label="${t("File")}">${L.view ? `<a class="mono" href="${esc(url(L.view, f.file, f.line))}" target="_blank" rel="noopener">${esc(f.file)}:${f.line}</a>` : `<span class="mono label">${esc(f.file)}:${f.line}</span>`}</td></tr>`).join("")}</tbody></table></div>`;
const flowCard = (title, fs) => `<article class="card"><div class="row"><h3>${title}</h3><span class="pill">${esc(tp(fs.length, "{n} flow", "{n} flows"))}</span></div>${fs.length ? flowRows(fs) : `<p class="empty">${t("No flow for this machine.")}</p>`}</article>`;
$("#flows-lead").textContent = t("Who may talk to whom, from the guest firewall rules: each address resolved to the machines it covers (Tofu IP, then ansible_host). {n} flows, {h} half-open.", {n: FL.length, h: FL.filter(f => f.half).length});
const flowKeys = [...new Set(FL.flatMap(f => [f.src.k, f.dst.k]).filter(Boolean))].sort((a, b) => mname(a).localeCompare(mname(b)));
$("#flowfilter").innerHTML += flowKeys.map(k => `<option value="${esc(k)}">${esc(mname(k))}</option>`).join("");
function renderFlows() {
  const k = $("#flowfilter").value, fs = FL.filter(f => $("#flowcommon").checked || !f.common);
  if (!FL.length) { $("#flows-list").innerHTML = `<article class="card"><p class="empty">${t("No flow: no guest firewall rule in the repository.")}</p></article>`; return; }
  if (k) {
    // the machine itself first, then the networks that include it
    const side = s => fs.filter(f => f[s].k === k || f[s].n.includes(k)).sort((a, b) => (a[s].k !== k) - (b[s].k !== k));
    $("#flows-list").innerHTML = flowCard(esc(t("Who can reach {name}", {name: mname(k)})), side("dst"))
      + flowCard(esc(t("What {name} can reach", {name: mname(k)})), side("src"));
    return;
  }
  const by = {};
  for (const f of fs) (by[f.owner] ||= []).push(f);
  $("#flows-list").innerHTML = Object.keys(by).sort((a, b) => mname(a).localeCompare(mname(b))).map(o => flowCard(mchip(o), by[o])).join("");
}
$("#flowfilter").addEventListener("change", e => { location.hash = e.target.value ? "flows/" + e.target.value : "flows"; });
$("#flowcommon").addEventListener("change", renderFlows);

// ---------- views and address (#overview, #machines, #roles, #flows, #flows/<machine>, #drift, #<machine>) ----------
const VIEWS = ["overview", "machines", "roles", "flows", "drift", ...(EDIT ? ["settings"] : [])];
if (EDIT) {
  document.querySelector('#nav [data-view="settings"]').hidden = false;
  renderSettings();
  const g = S.settings.git;
  const mode = g.url && g.push ? g.mode || "push" : "";
  $("#rv-go").textContent = t({push: "Commit and push", agit: "Commit and open a pull request", branch: "Commit and push a branch"}[mode] || "Commit");
  $("#rv-note").textContent = t(mode === "agit" || mode === "branch" ? "Authored by {user}, as a pull request to {branch}." : "Authored by {user}, on the branch {branch}.", {user: S.user, branch: g.url ? g.branch : "HEAD"});
}
function show(view) {
  document.querySelectorAll(".view").forEach(s => {
    const on = s.dataset.view === view;
    if (on && s.hidden) { s.classList.remove("enter"); void s.offsetWidth; s.classList.add("enter"); }
    s.hidden = !on;
  });
  document.querySelectorAll("#nav button").forEach(b => b.dataset.view === view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#view-title").textContent = t(view[0].toUpperCase() + view.slice(1));
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (M[h]) { selectHost(h); show("machines"); return; }
  if (h === "flows" || h.startsWith("flows/")) { $("#flowfilter").value = M[h.slice(6)] || flowKeys.includes(h.slice(6)) ? h.slice(6) : ""; renderFlows(); }
  show(VIEWS.includes(h.split("/")[0]) ? h.split("/")[0] : "overview");
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.view; });
addEventListener("hashchange", route);

// ---------- theme (auto, light, dark) and language, remembered per browser ----------
const THEMES = ["auto", "light", "dark"];
function setTheme(x) {
  if (x === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = x;
  $("#theme").textContent = t("Theme: {name}", {name: t(x)});
  try { localStorage.setItem("cairn-iac-theme", x); } catch {}
}
let th = "auto"; try { th = localStorage.getItem("cairn-iac-theme") || "auto"; } catch {}
setTheme(THEMES.includes(th) ? th : "auto");
$("#theme").addEventListener("click", () => setTheme(THEMES[(THEMES.indexOf(document.documentElement.dataset.theme || "auto") + 1) % 3]));
$("#lang").textContent = t("Language: {name}", {name: LANGS[lang].name});
$("#lang").addEventListener("click", () => {
  const ls = Object.keys(LANGS);
  try { localStorage.setItem("cairn-iac-lang", ls[(ls.indexOf(lang) + 1) % ls.length]); } catch {}
  location.reload();
});

if (first) selectHost(current);
route();
</script>
